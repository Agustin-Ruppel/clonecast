[project]
name = "clonecast-workers"
version = "0.0.1"
description = "Python workers for Clonecast: Whisper transcription and ffmpeg helpers"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.4.0",
    "face-recognition>=1.3.0",
]

[project.optional-dependencies]
local-whisper = [
    "openai-whisper>=20240930",
    "torch>=2.4.0",
]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
